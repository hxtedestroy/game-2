<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Хрю-карт</title>
<style>
:root{--bg:#1b1530;--card:#2a2147;--card2:#352a5c;--ac:#ff5fa2;--ac2:#ffd34a;--ok:#7be495;--tx:#fff;--mu:#b8aedc;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#ui{position:fixed;inset:0;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#241a45,#120d26 70%);overflow:hidden}
.scr.clear{background:transparent;pointer-events:none}.scr.clear>*{pointer-events:auto}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex:0 0 auto}
.top h2{margin:0;font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.btn{border:0;border-radius:14px;background:var(--card2);color:var(--tx);padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(180deg,#ff7ab5,#ff4f93);box-shadow:0 3px 0 #b02a66}
.btn.g{background:linear-gradient(180deg,#8aeaa0,#4fc974);color:#0b2a15;box-shadow:0 3px 0 #2d8a4c}
.btn.y{background:linear-gradient(180deg,#ffe27a,#ffbf2a);color:#3a2a00;box-shadow:0 3px 0 #b88410}
.btn.s{padding:8px 12px;font-size:14px;border-radius:11px}.btn[disabled]{opacity:.45}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border-radius:99px;padding:5px 11px;font-weight:700;font-size:14px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .btn{padding:16px 8px;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px}.menu .btn b{font-size:30px;line-height:1}
.menu .wide{grid-column:1/3}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.muted{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 6px;flex:0 0 auto;touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;border-radius:99px;background:rgba(255,255,255,.1);color:var(--mu);padding:8px 14px;font-size:14px;font-weight:700}
.tab.on{background:var(--ac);color:#fff}
.item{background:var(--card2);border-radius:13px;padding:9px 6px;text-align:center;font-size:12px;position:relative;border:2px solid transparent;min-height:66px;display:flex;flex-direction:column;justify-content:center;gap:3px;touch-action:manipulation}
.item.eq{border-color:var(--ok)}.item.lock{opacity:.8}.item b{font-size:13px}
.item .pr{color:var(--ac2);font-weight:800}.item .tag{position:absolute;top:3px;right:5px;font-size:11px}
.sw{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 10px}.sw i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;display:block}.sw i.on{border-color:#fff}
.garage{flex:1;display:flex;min-height:0}
.garage .pv{flex:0 0 42%;position:relative;display:flex;flex-direction:column}
.garage .pv canvas{flex:1;width:100%;min-height:0;touch-action:none}
.garage .pn{flex:1;display:flex;flex-direction:column;min-width:0}
@media(orientation:portrait){.garage{flex-direction:column}.garage .pv{flex:0 0 34%}}
.dlg{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,6,24,.6);z-index:20}
.dlg .box{background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-start;min-height:150px}
.dlg .av{font-size:52px;line-height:1}.dlg .nm{font-weight:800;color:var(--ac2);margin-bottom:4px}.dlg .tx{font-size:17px;line-height:1.35}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,6,24,.72);z-index:30;padding:16px}
.modal .mb{background:var(--card);border-radius:22px;padding:18px;width:min(460px,100%);max-height:92%;overflow:auto;touch-action:pan-y}
.modal h3{margin:0 0 10px}
.star{color:#ffd34a;letter-spacing:2px}.star.off{color:#5a4f80}
.stage{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:13px;padding:10px;margin-top:8px}
.stage.lock{opacity:.45}.stage .n{flex:1}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:2px solid var(--card2);background:#150f2b;color:#fff;font-size:18px;user-select:text;-webkit-user-select:text}
input[type=range]{width:100%;accent-color:var(--ac)}
select{background:var(--card2);color:#fff;border:0;border-radius:10px;padding:9px;font-size:15px}
.setrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07)}.setrow label{flex:1}
.setrow .v{min-width:40px;text-align:right;color:var(--mu)}
.sch{display:flex;gap:6px}.sch .btn{flex:1;padding:10px 4px;font-size:13px}.sch .btn.on{background:var(--ac)}
.rk{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}.rk.me{background:rgba(255,95,162,.18);border-radius:10px}.rk .no{width:30px;color:var(--mu);font-weight:800}
.rb{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1b1530}
.code{font-size:40px;font-weight:900;letter-spacing:8px;text-align:center;color:var(--ac2)}
.plr{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px;margin-bottom:8px}
.title{font-size:34px;font-weight:900;text-align:center;margin:14px 0 4px;background:linear-gradient(90deg,#ff5fa2,#ffd34a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud .t{position:absolute;color:#fff;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 8px rgba(0,0,0,.4)}
#hPlace{left:14px;top:8px;font-size:46px}#hPlace small{font-size:22px}
#hLap{left:14px;top:62px;font-size:18px}#hTime{right:14px;top:8px;font-size:22px}#hCoins{right:14px;top:38px;font-size:20px}
#hSpd{left:50%;transform:translateX(-50%);bottom:10px;font-size:20px;opacity:.9}
#itemBox{position:absolute;left:50%;transform:translateX(-50%);top:10px;width:64px;height:64px;border-radius:16px;background:rgba(0,0,0,.45);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:34px}
#itemBox small{position:absolute;right:4px;bottom:0;font-size:14px;font-weight:900}
#drift{position:absolute;left:50%;transform:translateX(-50%);bottom:42px;width:140px;height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}#drift i{display:block;height:100%;width:0;background:#fff}
#mini{position:absolute;right:10px;bottom:10px;width:130px;height:130px;opacity:.9}
#toast{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:38px;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#count{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:120px;font-weight:900;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.5)}
#flash{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,60,60,.5));opacity:0;transition:opacity .35s}
#tPause{pointer-events:auto;position:absolute;left:50%;transform:translateX(-50%);top:84px;width:44px;height:36px;border-radius:12px;border:0;background:rgba(0,0,0,.4);color:#fff;font-size:18px}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.tb{pointer-events:auto;position:absolute;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;touch-action:none;backdrop-filter:blur(2px);font-size:26px}
.tb.on{background:rgba(255,95,162,.6)}
#joyZone{pointer-events:auto;position:absolute;left:0;top:30%;bottom:0;width:50%;touch-action:none}
#joyBase{display:none;position:fixed;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.4);pointer-events:none}
#joyKnob{position:absolute;left:28px;top:28px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.6)}
#pauseM .mb{text-align:center}
</style></head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hide">
  <div class="t" id="hPlace"></div><div class="t" id="hLap"></div><div class="t" id="hTime"></div><div class="t" id="hCoins"></div>
  <div id="itemBox" class="hide"></div><div id="drift"><i></i></div><div class="t" id="hSpd"></div>
  <canvas id="mini" width="260" height="260"></canvas><div id="toast"></div><div id="count"></div><div id="flash"></div>
  <button id="tPause">⏸</button>
</div>
<div id="touch" class="hide">
  <div id="joyZone" class="hide"></div><div id="joyBase" class="hide"><div id="joyKnob"></div></div>
  <div class="tb" id="tLeft">◀</div><div class="tb" id="tRight">▶</div>
  <div class="tb" id="tGas">GAS</div><div class="tb" id="tBrk">⏹</div><div class="tb" id="tDrift">↯</div><div class="tb" id="tItem">🎁</div>
</div>
<div id="ui"></div>
<script src="three.min.js"></script><script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script src="core1.js"></script><script src="core2.js"></script><script src="data.js"></script>
<script src="gfx1.js"></script><script src="gfx2.js"></script><script src="game1.js"></script><script src="game2.js"></script><script src="ui.js"></script>
</body></html>
